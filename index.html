<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Para ti ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cloudy-1: #2b2438;
      --bg-cloudy-2: #3d314a;
      --bg-sunny-1: #fff0f5;
      --bg-sunny-2: #ffd6e7;
      --bg-sunny-3: #f3d9fa;
      --text-cloudy: #f3e8ff;
      --text-sunny: #4a1c40;
      --accent-rose: #e84393;
      --glass-cloudy: rgba(255, 235, 245, 0.08);
      --glass-sunny: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--bg-cloudy-1), var(--bg-cloudy-2));
      color: var(--text-cloudy);
      transition: color 1.6s ease;
    }

    .sky-bright {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 75% 20%, #fff9fb 0%, var(--bg-sunny-1) 35%, var(--bg-sunny-2) 70%, var(--bg-sunny-3) 100%);
      opacity: 0;
      transition: opacity 2s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 0;
    }

    body.is-sunny .sky-bright {
      opacity: 1;
    }

    body.is-sunny {
      color: var(--text-sunny);
    }

    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .sun-orb {
      position: fixed;
      top: -90px;
      right: -90px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 10%, rgba(255, 182, 193, 0.75) 45%, rgba(232, 67, 147, 0) 72%);
      filter: blur(8px);
      transform: scale(0.4);
      opacity: 0;
      transition: transform 2.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease;
      pointer-events: none;
      z-index: 1;
    }

    body.is-sunny .sun-orb {
      opacity: 1;
      transform: scale(1.15);
      animation: sunPulse 6s ease-in-out infinite alternate;
    }

    @keyframes sunPulse {
      0% { transform: scale(1.1); }
      100% { transform: scale(1.25); }
    }

    .cloud {
      position: fixed;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 40%, rgba(230, 210, 245, 0.16), rgba(180, 150, 200, 0.03));
      filter: blur(22px);
      pointer-events: none;
      z-index: 1;
      transition: transform 2.4s ease, opacity 2s ease;
    }

    .cloud-1 { width: 320px; height: 110px; top: 8%; left: -60px; }
    .cloud-2 { width: 380px; height: 130px; top: 18%; right: -80px; }
    .cloud-3 { width: 290px; height: 95px; bottom: 14%; left: 10%; }

    body.is-sunny .cloud-1 { transform: translateX(-140px); opacity: 0; }
    body.is-sunny .cloud-2 { transform: translateX(140px); opacity: 0; }
    body.is-sunny .cloud-3 { transform: translateY(80px); opacity: 0; }

    .card {
      position: relative;
      z-index: 3;
      width: min(90vw, 480px);
      padding: 2.5rem 2rem;
      border-radius: 28px;
      background: var(--glass-cloudy);
      border: 1px solid rgba(255, 220, 240, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(24, 12, 36, 0.35);
      text-align: center;
      transition: background 1.8s ease, border-color 1.8s ease, box-shadow 1.8s ease, transform 0.6s ease;
    }

    body.is-sunny .card {
      background: var(--glass-sunny);
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 24px 60px rgba(232, 67, 147, 0.18);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      color: #f8c8dc;
      transition: all 1.4s ease;
    }

    body.is-sunny .badge {
      background: rgba(232, 67, 147, 0.12);
      color: #c2185b;
    }

    /* Vista nublada: Poema inicial */
    .cloudy-content {
      transition: opacity 0.7s ease, transform 0.7s ease, max-height 0.8s ease;
      max-height: 400px;
      opacity: 1;
      overflow: hidden;
    }

    body.is-sunny .cloudy-content {
      opacity: 0;
      transform: translateY(-10px) scale(0.96);
      max-height: 0;
      pointer-events: none;
    }

    .poem {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.65rem, 5vw, 2.15rem);
      line-height: 1.45;
      font-weight: 500;
      margin-bottom: 1.8rem;
    }

    .verse {
      display: block;
      opacity: 0.92;
    }

    .verse + .verse {
      margin-top: 1.1rem;
    }

    .highlight-sun,
    .highlight-color {
      font-style: italic;
      font-weight: 600;
    }

    /* Vista soleada: Solo "Te quiero mi princesa" + flor */
    .sunny-content {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(14px) scale(0.92);
      transition: opacity 1.1s ease 0.25s, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.25s, max-height 0.9s ease;
      pointer-events: none;
    }

    body.is-sunny .sunny-content {
      max-height: 360px;
      opacity: 1;
      transform: translateY(0) scale(1);
      margin-bottom: 1.8rem;
      pointer-events: auto;
    }

    .flower-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.9rem;
      animation: flowerFloat 3.6s ease-in-out infinite;
    }

    .flower-svg {
      width: 84px;
      height: 84px;
      filter: drop-shadow(0 8px 18px rgba(232, 67, 147, 0.28));
    }

    @keyframes flowerFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg) scale(1); }
      50% { transform: translateY(-6px) rotate(3deg) scale(1.06); }
    }

    .princess-phrase {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 6vw, 2.65rem);
      font-weight: 600;
      font-style: italic;
      line-height: 1.25;
      background: linear-gradient(120deg, #d81b60, #e84393, #9b51e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(232, 67, 147, 0.15);
    }

    .action-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      padding: 0.9rem 1.8rem;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #fff;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      box-shadow: 0 10px 25px rgba(255, 117, 140, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.6s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(232, 67, 147, 0.45);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    body.is-sunny .action-btn {
      background: linear-gradient(135deg, #e84393 0%, #fd79a8 100%);
    }

    .hint {
      margin-top: 1.2rem;
      font-size: 0.78rem;
      opacity: 0.65;
      transition: opacity 0.8s ease;
    }
  </style>
</head>
<body>
  <div class="sky-bright"></div>
  <div class="sun-orb"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <canvas id="fx-canvas"></canvas>

  <main class="card" id="card">
    <span class="badge" id="badge">Un día gris</span>

    <!-- Frase inicial en día nublado -->
    <div class="cloudy-content">
      <div class="poem">
        <span class="verse">
          “En un día nublado así,<br>
          eres <span class="highlight-sun">suficiente sol</span> para mí;
        </span>
        <span class="verse">
          y en un día gris,<br>
          eres <span class="highlight-color">suficiente color</span> para mí.”
        </span>
      </div>
    </div>

    <!-- Frase única al apretar el botón -->
    <div class="sunny-content">
      <div class="flower-wrap" aria-hidden="true">
        <svg class="flower-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="petalGrad" cx="50%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ffb8d1" />
              <stop offset="65%" stop-color="#ff6fa5" />
              <stop offset="100%" stop-color="#e84393" />
            </radialGradient>
            <radialGradient id="centerGrad" cx="40%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#fff3b0" />
              <stop offset="65%" stop-color="#ffd166" />
              <stop offset="100%" stop-color="#f4a261" />
            </radialGradient>
          </defs>
          <!-- Pétalos -->
          <ellipse cx="60" cy="27" rx="15" ry="24" fill="url(#petalGrad)" />
          <ellipse cx="60" cy="93" rx="15" ry="24" fill="url(#petalGrad)" />
          <ellipse cx="27" cy="60" rx="24" ry="15" fill="url(#petalGrad)" />
          <ellipse cx="93" cy="60" rx="24" ry="15" fill="url(#petalGrad)" />
          <ellipse cx="36.5" cy="36.5" rx="15" ry="24" transform="rotate(-45 36.5 36.5)" fill="url(#petalGrad)" opacity="0.92" />
          <ellipse cx="83.5" cy="83.5" rx="15" ry="24" transform="rotate(-45 83.5 83.5)" fill="url(#petalGrad)" opacity="0.92" />
          <ellipse cx="83.5" cy="36.5" rx="15" ry="24" transform="rotate(45 83.5 36.5)" fill="url(#petalGrad)" opacity="0.92" />
          <ellipse cx="36.5" cy="83.5" rx="15" ry="24" transform="rotate(45 36.5 83.5)" fill="url(#petalGrad)" opacity="0.92" />
          <!-- Centro de la flor -->
          <circle cx="60" cy="60" r="15" fill="url(#centerGrad)" />
          <circle cx="55" cy="55" r="3" fill="#fff9db" opacity="0.8" />
        </svg>
      </div>
      <h1 class="princess-phrase">Te quiero mi princesa</h1>
    </div>

    <button class="action-btn" id="toggleBtn">Iluminar el día ✨</button>
    <p class="hint" id="hint">Toca la pantalla para dejar destellos de color</p>
  </main>

  <script>
    const body = document.body;
    const toggleBtn = document.getElementById('toggleBtn');
    const badge = document.getElementById('badge');
    const hint = document.getElementById('hint');
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');

    let isSunny = false;
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const raindrops = Array.from({ length: 65 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      len: 10 + Math.random() * 14,
      speed: 2.5 + Math.random() * 3,
      opacity: 0.15 + Math.random() * 0.25
    }));

    const palette = ['#ff758c', '#ff7eb3', '#e84393', '#d6a2e8', '#fdcb6e', '#ff9ff3'];
    const petals = Array.from({ length: 38 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: 3 + Math.random() * 5,
      vx: -0.4 + Math.random() * 0.8,
      vy: -0.3 - Math.random() * 0.7,
      color: palette[Math.floor(Math.random() * palette.length)],
      alpha: 0.4 + Math.random() * 0.5,
      wobble: Math.random() * Math.PI * 2
    }));

    const bursts = [];

    function spawnBurst(x, y, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const speed = 1.5 + Math.random() * 3.5;
        bursts.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 2.5 + Math.random() * 3.5,
          color: palette[Math.floor(Math.random() * palette.length)],
          life: 1,
          decay: 0.016 + Math.random() * 0.015,
          isHeart: Math.random() > 0.45
        });
      }
    }

    function drawHeart(x, y, size, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 1.4, x, y + size);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 1.4, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      if (!isSunny) {
        ctx.strokeStyle = 'rgba(243, 217, 250, 0.28)';
        ctx.lineWidth = 1.2;
        for (const d of raindrops) {
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - 1.5, d.y + d.len);
          ctx.stroke();

          d.y += d.speed;
          d.x -= 0.4;
          if (d.y > height) {
            d.y = -20;
            d.x = Math.random() * width;
          }
        }
      } else {
        for (const p of petals) {
          p.wobble += 0.025;
          p.x += p.vx + Math.sin(p.wobble) * 0.35;
          p.y += p.vy;

          if (p.y < -15) {
            p.y = height + 15;
            p.x = Math.random() * width;
          }
          if (p.x < -15) p.x = width + 15;
          if (p.x > width + 15) p.x = -15;

          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.03;
        b.life -= b.decay;

        if (b.life <= 0) {
          bursts.splice(i, 1);
          continue;
        }

        if (b.isHeart) {
          drawHeart(b.x, b.y, b.r * 2.6, b.color, b.life);
        } else {
          ctx.save();
          ctx.globalAlpha = b.life;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(animate);
    }

    animate();

    function toggleSky() {
      isSunny = !isSunny;
      body.classList.toggle('is-sunny', isSunny);

      if (isSunny) {
        badge.textContent = 'Para ti';
        toggleBtn.textContent = 'Volver a las nubes ☁️';
        hint.textContent = 'Toca donde quieras para soltar corazones y color';
        spawnBurst(width / 2, height / 2, 28);
      } else {
        badge.textContent = 'Un día gris';
        toggleBtn.textContent = 'Iluminar el día ✨';
        hint.textContent = 'Toca la pantalla para dejar destellos de color';
      }
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSky();
    });

    document.addEventListener('pointerdown', (e) => {
      if (e.target === toggleBtn) return;
      spawnBurst(e.clientX, e.clientY, 14);
      if (!isSunny) {
        toggleSky();
      }
    });
  </script>
</body>
</html>
